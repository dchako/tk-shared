[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thunderclouds-shared"
version = "0.1.0"
requires-python = ">=3.11"
# fastapi NO se declara como dependencia a propósito (incidente 2026-09-02):
# cada servicio consumidor lo pinea a SU versión exacta (0.110.0 en
# auth/billing/resources/provisioning; más nueva en bridge/mcp) y declararlo
# acá hacía que cualquier `pip install thunderclouds-shared` arrastrara el
# fastapi más nuevo, pisando el pin del host (3 rondas de falsos positivos en
# tests en un solo día). El host SIEMPRE provee fastapi/starlette; este paquete
# solo los importa.
dependencies = [
    "python-jose[cryptography]>=3.3",
    "httpx>=0.25",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["thunderclouds_shared*"]
